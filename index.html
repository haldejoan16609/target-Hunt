<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Target Hunt</title><link rel="stylesheet" href="style.css"></head><body><header><b>🎯 TARGET HUNT</b><span id="roomBadge"></span></header><main>
<section id="home" class="screen active"><div class="hero"><small>2–8 PLAYER PARTY GAME</small><h1>Find it.<br><em>Beat everyone.</em></h1><p>10 rounds of increasingly chaotic target hunts.</p><div class="card form"><input id="name" maxlength="18" placeholder="Your name"><button onclick="createRoom()">CREATE ROOM</button><div class="or">or join a room</div><div class="row"><input id="joinCode" maxlength="6" placeholder="ROOM CODE"><button onclick="joinRoom()">JOIN</button></div></div></div></section>
<section id="lobby" class="screen"><div class="card lobby"><small>ROOM CODE</small><div id="bigCode" class="bigcode">------</div><p>Share this code with your friends.</p><div id="players"></div><button id="startBtn" onclick="startGame()">START GAME</button><div id="lobbyMsg"></div></div></section>
<section id="game" class="screen"><div class="gameTop"><div><b id="roundLabel"></b><div id="twist"></div></div><strong id="timer"></strong></div><div class="target">FIND <b id="target"></b></div><div id="board"></div></section>
<section id="results" class="screen"><div class="card results"><small>ROUND COMPLETE</small><h2 id="resultTitle"></h2><div id="resultList"></div><button id="nextBtn" onclick="nextRound()">NEXT ROUND</button></div></section>
<section id="finished" class="screen"><div class="card results"><small>FINAL SCORE</small><h1>🏆 <span id="winner"></span></h1><div id="finalList"></div><button onclick="location.reload()">PLAY AGAIN</button></div></section></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
